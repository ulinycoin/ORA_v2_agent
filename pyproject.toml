[project]
name = "ora-v2"
version = "2.0.0"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.19",
    "python-telegram-bot>=21.0",
    "tenacity>=8.0",
    "certifi",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
redis = ["arq>=0.26"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ora_v2/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
